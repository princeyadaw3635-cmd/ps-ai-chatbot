<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PS AI — Your Personal AI</title>
  <meta name="description" content="Meet PS AI, your personal AI assistant.">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0b12;
      color: #f5f3ff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 18px 24px;
      border-bottom: 1px solid #292638;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo { font-size: 23px; font-weight: bold; }
    .logo span { color: #a78bfa; }
    .tag { color: #c4b5fd; font-size: 12px; }
    main {
      width: min(760px, 100%);
      margin: auto;
      padding: 30px 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }
    .welcome { text-align: center; margin: auto 0 24px; }
    h1 { font-size: clamp(30px, 6vw, 46px); margin-bottom: 12px; }
    h1 span { color: #a78bfa; }
    .sub { color: #a8a5b8; line-height: 1.6; }
    #chat {
      display: flex;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 20px;
    }
    .message {
      padding: 14px 16px;
      border-radius: 16px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .user { background: #31234f; align-self: flex-end; max-width: 85%; }
    .bot { background: #191824; border: 1px solid #302c40; }
    form {
      display: flex;
      gap: 10px;
      padding: 10px;
      border: 1px solid #383247;
      background: #15131e;
      border-radius: 18px;
      margin-top: 20px;
    }
    input {
      flex: 1; min-width: 0; border: 0; outline: 0;
      background: transparent; color: white; padding: 12px;
      font-size: 16px;
    }
    button {
      border: 0; border-radius: 12px; padding: 12px 18px;
      background: #8b5cf6; color: white; font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #7c3aed; }
    footer { text-align: center; padding: 16px; color: #888397; font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div class="logo">PS <span>AI</span></div>
    <div class="tag">YOUR PERSONAL AI</div>
  </header>

  <main>
    <section class="welcome" id="welcome">
      <h1>Meet Your <span>AI Assistant</span></h1>
      <p class="sub">Ask questions. Explore ideas. Get things done.</p>
      <p class="sub">A new AI experience by PS AI.</p>
    </section>

    <section id="chat" aria-live="polite"></section>

    <form id="chatForm">
      <input id="prompt" maxlength="2000"
        placeholder="Message PS AI..." autocomplete="off"
        aria-label="Your message" required>
      <button type="submit">Send</button>
    </form>
    <p class="sub" style="text-align:center;font-size:12px">
      Early preview · AI engine not connected yet
    </p>
  </main>

  <footer>© 2026 PS AI · Built with ambition.</footer>

  
<script>
const SUPABASE_FUNCTION_URL = "https://bqyafptuvzbkhvnyezpa.supabase.co/functions/v1/ps-ai-chat;
const SUPABASE_ANON_KEY = "";

const form = document.getElementById("chatForm");
const input = document.getElementById("prompt");
const chat = document.getElementById("chat");
const welcome = document.getElementById("welcome");

form.addEventListener("submit", async function (event) {
  event.preventDefault();

  const text = input.value.trim();
  if (!text) return;

  welcome.style.display = "none";

  const userMessage = document.createElement("div");
  userMessage.className = "message user";
  userMessage.textContent = text;
  chat.appendChild(userMessage);

  const replyMessage = document.createElement("div");
  replyMessage.className = "message bot";
  replyMessage.textContent = "PS AI सोच रहा है...";
  chat.appendChild(replyMessage);

  input.value = "";
  input.focus();
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

  try {
    const response = await fetch(SUPABASE_FUNCTION_URL, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "apikey": SUPABASE_ANON_KEY,
        "Authorization": "Bearer " + SUPABASE_ANON_KEY
      },
      body: JSON.stringify({ message: text })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data.error || "Request failed: " + response.status);
    }

    replyMessage.textContent = data.reply || "कोई जवाब नहीं मिला।";
  } catch (error) {
    replyMessage.textContent =
      "माफ़ कीजिए, अभी कनेक्शन में समस्या है। कृपया दोबारा कोशिश करें।";
    console.error("PS AI error:", error);
  }

  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });
});
</script>
